version: '3.9'

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: stock_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stock_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JQUANTS_API_KEY: ${JQUANTS_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      ENV: ${ENV:-development}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: stock_ml
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      JQUANTS_API_KEY: ${JQUANTS_API_KEY}
      JQUANTS_MAIL_ADDRESS: ${JQUANTS_MAIL_ADDRESS}
      JQUANTS_PASSWORD: ${JQUANTS_PASSWORD}
      JQUANTS_REFRESH_TOKEN: ${JQUANTS_REFRESH_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ENV: ${ENV:-development}
    volumes:
      - ./ml:/app
      - ml_models:/app/models
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
  ml_models:
