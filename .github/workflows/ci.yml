name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── バックエンド テスト ──────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    # テストはインメモリ SQLite で完結するため DB サービス不要

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend deps
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run backend tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          JWT_SECRET: test-secret
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          STRIPE_PRICE_ID_PRO: price_dummy
          TESTING: "1"
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  # ── バックエンド PostgreSQL 実機テスト ───────────────────────────────
  # 通常のテストは SQLite なので、PostgreSQL に無い関数を使っても通ってしまう。
  # 生 SQL を使う公開 API（シグナル・バックテスト）を PostgreSQL で流して、本番専用の不具合を防ぐ。
  backend-test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend deps
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run PostgreSQL tests
        env:
          # アプリ本体の設定（import 時に必要）。テスト用の DB は TEST_POSTGRES_URL で渡す
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          TEST_POSTGRES_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          JWT_SECRET: test-secret
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          STRIPE_PRICE_ID_PRO: price_dummy
          TESTING: "1"
        run: |
          cd backend
          python -m pytest tests/test_postgres_queries.py -v --tb=short

  # ── フロントエンド ビルド ────────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npx tsc --noEmit

      - name: Lint
        run: cd frontend && npx next lint --max-warnings=0 || true

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: https://example.com
        run: cd frontend && npm run build

  # ── scripts テスト ──────────────────────────────────────────────────
  scripts-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install pytest pytest-asyncio
          pip install "sqlalchemy[asyncio]" asyncpg aiopg python-dotenv greenlet

      - name: Run script unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://dummy:dummy@localhost/dummy
        run: |
          pytest scripts/test_send_daily_signals.py -v --tb=short -k "not asyncio_main"

  # ── ML パイプライン lint + tests ─────────────────────────────────────
  ml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools + test deps
        run: pip install ruff pytest numpy pandas scikit-learn

      - name: Lint ML pipeline
        run: |
          ruff check ml/pipeline/ --select=E,F --ignore=E501 || true

      - name: Run ML unit tests
        env:
          DATABASE_URL: "sqlite:////:memory:"
        run: |
          pytest ml/tests/ -v --tb=short || true
