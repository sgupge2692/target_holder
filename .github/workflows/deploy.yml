name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:  # 手動実行も可能

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # Repository Variable VPS_READY=true を設定するまでスキップ
    # 設定方法: GitHub → Settings → Variables → New repository variable
    #   Name: VPS_READY  Value: true
    if: vars.VPS_READY == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/stock-intelligence

            echo "=== git pull ==="
            git pull origin main

            echo "=== .env チェック ==="
            if [ ! -f .env ]; then
              echo "ERROR: .env が存在しません。サーバーで手動作成してください。"
              exit 1
            fi

            echo "=== フロントエンドビルド ==="
            docker compose -f docker-compose.prod.yml build frontend

            echo "=== バックエンドビルド ==="
            docker compose -f docker-compose.prod.yml build backend

            echo "=== DBマイグレーション ==="
            docker compose -f docker-compose.prod.yml run --rm backend \
              python -c "
            import asyncio
            from app.database import engine
            from app.base import Base
            from app.models import User
            from sqlalchemy import text
            async def migrate():
                async with engine.begin() as conn:
                    await conn.run_sync(Base.metadata.create_all)
                    # email_signal_alert カラムを追加（既存DBの場合）
                    try:
                        await conn.execute(text('ALTER TABLE users ADD COLUMN IF NOT EXISTS email_signal_alert BOOLEAN DEFAULT FALSE'))
                        await conn.execute(text('ALTER TABLE users ADD COLUMN IF NOT EXISTS email_unsubscribed BOOLEAN DEFAULT FALSE'))
                    except:
                        pass
            asyncio.run(migrate())
            "

            echo "=== コンテナ再起動 ==="
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "=== ヘルスチェック ==="
            sleep 5
            curl -sf http://localhost:8000/api/health || echo "WARNING: backend health check failed"

            echo "=== デプロイ完了 ✓ ==="
