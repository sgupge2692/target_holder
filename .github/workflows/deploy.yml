name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:  # 手動実行も可能

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # Repository Variable VPS_READY=true を設定するまでスキップ
    # 設定方法: GitHub → Settings → Variables → New repository variable
    #   Name: VPS_READY  Value: true
    if: vars.VPS_READY == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/kabumi

            echo "=== git pull ==="
            git pull origin main

            echo "=== .env チェック ==="
            if [ ! -f .env ]; then
              echo "ERROR: .env が存在しません。サーバーで手動作成してください。"
              exit 1
            fi

            echo "=== nginx.conf チェック ==="
            if [ ! -f nginx/nginx.conf ]; then
              echo "ERROR: nginx/nginx.conf が存在しません。"
              echo "  make domain-setup DOMAIN=<your-domain> を実行してください。"
              exit 1
            fi

            echo "=== フロントエンドビルド ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build frontend

            echo "=== バックエンドビルド ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build backend

            echo "=== DBマイグレーション (Alembic) ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm backend \
              alembic upgrade head

            echo "=== コンテナ再起動 ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            echo "=== ヘルスチェック ==="
            sleep 8
            if command -v curl &>/dev/null; then
              curl -sf http://localhost:8000/api/health \
                && echo "✓ backend healthy" \
                || echo "WARNING: backend health check failed"
            else
              docker compose -f docker-compose.yml -f docker-compose.prod.yml \
                exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" \
                && echo "✓ backend healthy" \
                || echo "WARNING: backend health check failed"
            fi

            echo "=== デプロイ完了 ✓ ==="
