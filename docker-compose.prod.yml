# 本番用オーバーライド: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# または make prod-up (Makefile 参照)

services:
  db:
    restart: unless-stopped
    # 本番では外部ポートを閉じる（nginx 経由のみ）
    ports: []

  redis:
    restart: unless-stopped
    ports: []
    # 最大メモリ制限 + LRU 退避ポリシー
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: unless-stopped
    # 開発用ボリュームマウントを外す
    volumes:
      - ml_models:/app/models:ro
      - ./scripts:/scripts:ro      # 日次メール・X投稿（daily_pipeline.yml が exec で実行）
    ports: []
    env_file:
      - .env
    environment:
      ENV: production
      DEBUG: "false"
      CORS_ORIGINS: "${CORS_ORIGINS}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      RELEASE: "${RELEASE:-unknown}"
      EMAIL_PROVIDER: "${EMAIL_PROVIDER:-smtp}"
      EMAIL_FROM: "${EMAIL_FROM}"
      EMAIL_FROM_NAME: "${EMAIL_FROM_NAME:-かぶみ}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SENDGRID_API_KEY: "${SENDGRID_API_KEY:-}"
      ADMIN_EMAILS: "${ADMIN_EMAILS:-}"
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    restart: unless-stopped
    volumes: []
    ports: []
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "http://backend:8000"
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL}"
      NEXT_PUBLIC_SENTRY_DSN: "${NEXT_PUBLIC_SENTRY_DSN:-}"
      NEXT_PUBLIC_RELEASE: "${RELEASE:-unknown}"
    deploy:
      resources:
        limits:
          memory: 256M

  ml:
    restart: unless-stopped
    # 日次パイプライン（GitHub Actions の daily_pipeline.yml）が `docker compose exec` で実行する。
    # イメージの既定 CMD は fetch_data.py を1回実行して終了するため、そのままだと exec できず、再起動も繰り返す。
    command: ["sleep", "infinity"]
    volumes:
      - ml_models:/app/models
    ports: []
    env_file:
      - .env
    environment:
      ENV: production
      NEWS_FEATURES: "${NEWS_FEATURES:-auto}"        # auto: 蓄積が NEWS_MIN_DAYS 日以上なら学習に使う / on / off
      NEWS_MIN_DAYS: "${NEWS_MIN_DAYS:-90}"
      NEWS_MAX_STOCKS: "${NEWS_MAX_STOCKS:-300}"
      NEWS_USE_LLM: "${NEWS_USE_LLM:-false}"
    deploy:
      resources:
        limits:
          memory: 2G

  nginx:
    image: nginx:1.27-alpine
    container_name: stock_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Let's Encrypt 証明書自動更新 ────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: stock_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # 12時間ごとに更新チェック
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"

volumes:
  db_data:
  redis_data:
  ml_models:
  certbot_www:
  certbot_conf:
